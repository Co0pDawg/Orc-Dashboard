<title>Orchestration Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/sleek.css">
<link rel="stylesheet" href="css/leet.css">

<div class="wrap">
  <div class="top" id="top">
    <div id="chooser"></div>
    <div class="controls" id="controls">
  <details class="pop settings" id="settings-menu">
    <summary class="btn">Settings ▾</summary>
    <div class="menu">
      <fieldset class="opt">
        <legend>A session counts as finished when</legend>
        <label><input type="radio" name="done-when" id="done-when-fable" value="fable"> Fable marks it Done</label>
        <label><input type="radio" name="done-when" id="done-when-pr" value="pr"> Its pull request is completed</label>
        <small>Until then it stays on the chips and expanded, with its PR status in the header. Sessions without a recorded PR finish when Fable marks them Done.</small>
      </fieldset>
    </div>
  </details>
  <label class="skin" for="skin-toggle"><span id="lbl-sleek">Sleek</span><input type="checkbox" role="switch" id="skin-toggle" aria-label="Terminal (1337) look"><span id="lbl-leet">1337</span></label>
  <div class="layout-bar" id="layout-bar" hidden>
    <details class="pop reset" id="reset-menu" hidden>
      <summary class="btn">Reset layout ▾</summary>
      <div class="menu">
        <button type="button" class="btn" data-reset="order">Order<small>Activity log first, tickets in plan order</small></button>
        <button type="button" class="btn" data-reset="size">Sizes<small>Every pane back to one column, one row</small></button>
        <button type="button" class="btn" data-reset="all">Everything<small>Order and sizes</small></button>
      </div>
    </details>
    <button type="button" class="btn" id="customize" aria-pressed="false">Customize layout</button>
  </div>
    </div>
  </div>
  <div class="stack" id="stack" data-cols="1"></div>
</div>
<div class="toast" id="toast" hidden><span id="toast-msg"></span><button type="button" class="btn" id="undo">Undo</button></div>
<div class="sr" id="sr" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.7/Sortable.min.js"></script>
<script type="module" src="js/main.js"></script>
