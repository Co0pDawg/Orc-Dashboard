<title>Orchestration Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/palettes.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/sleek.css">
<link rel="stylesheet" href="css/leet.css">

<div class="wrap">
  <div class="top" id="top">
    <div id="chooser"></div>
    <!-- The Settings gear: renderChooser() re-attaches this one element right after the clock. -->
    <details class="pop settings" id="settings-menu">
      <!-- Filled from js/partials/settings-menu.js before the other modules load. -->
    </details>
  </div>
  <nav class="views" aria-label="Pages"><button type="button" class="btn" data-go="board">Board</button><button type="button" class="btn" data-go="time">Time</button></nav>
  <div class="stack" id="stack" data-cols="1"></div>
  <!-- The Time page; shown in place of the stack when the hash names time, time-week or time-month. -->
  <section class="time-view" id="time-view" aria-label="Time">
    <div class="time-bar">
      <div class="tabs" role="tablist" aria-label="Time range"><button type="button" class="btn" role="tab" data-tview="day">Day</button><button type="button" class="btn" role="tab" data-tview="week">Week</button><button type="button" class="btn" role="tab" data-tview="month">Month</button></div>
      <div class="tnav"><button type="button" class="btn" data-tnav="-1" id="time-prev">◀</button><button type="button" class="btn" data-tnav="0">Today</button><button type="button" class="btn" data-tnav="1" id="time-next">▶</button><input type="date" id="time-date" aria-label="Go to date"></div>
      <h1 class="time-label" id="time-label"></h1>
    </div>
    <div class="time-body" id="time-body"></div>
  </section>
</div>
<dialog class="dlg" id="scrum-dialog" aria-labelledby="scrum-title">
  <div class="dlg-head"><h2 id="scrum-title">Scrum</h2><button type="button" class="btn" id="scrum-close">Close</button></div>
  <div id="scrum-body"></div>
</dialog>
<div class="toast" id="toast" hidden><span id="toast-msg"></span><button type="button" class="btn" id="undo">Undo</button></div>
<div class="sr" id="sr" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.7/Sortable.min.js"></script>
<script type="module" src="js/main.js"></script>
